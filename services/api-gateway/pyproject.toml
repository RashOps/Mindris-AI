[project]
name = "api-gateway"
version = "0.4.0"
description = "Mindris AI API Gateway service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.0.3",
    "database",
    "utils",
]

[project.optional-dependencies]
ai = [
    "crewai[google-genai]>=1.14.3",
    "intelligence",
    "llama-cloud>=2.0.0",
    "scraper",
]

[tool.uv.sources]
database = { workspace = true }
intelligence = { workspace = true }
scraper = { workspace = true }
utils = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api_gateway"]
package-dir = {"api_gateway" = "."}
