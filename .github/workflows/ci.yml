name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: apps/web
        run: bun install --frozen-lockfile
      - working-directory: apps/web
        run: bun test
      - working-directory: apps/web
        run: bun run lint
      - working-directory: apps/web
        run: bun run typecheck
      - working-directory: apps/web
        run: bun run build
      - working-directory: services/renderer
        run: bun install --frozen-lockfile
      - working-directory: services/renderer
        run: bun test
      - working-directory: services/renderer
        run: bun run typecheck
      - working-directory: services/renderer
        run: bun run build

  docker-self-hosted-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.release.yml config --quiet
      - run: sh -n scripts/install_self_hosted.sh scripts/update_self_hosted.sh scripts/uninstall_self_hosted.sh scripts/smoke_release.sh scripts/clean_self_hosted_test.sh scripts/verify_release_promotion.sh scripts/test_release_policy.sh
      - run: scripts/test_release_policy.sh
      - run: |
          MINDRIS_HOME=/tmp/mindris-ai-ci-dry-run \
          MINDRIS_INSTALL_DRY_RUN=true \
          MINDRIS_RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}" \
          scripts/install_self_hosted.sh

  browser-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --all-packages --frozen
      - run: uv run playwright install chromium
      - working-directory: apps/web
        run: bun install --frozen-lockfile
      - working-directory: services/renderer
        run: bun install --frozen-lockfile
      - run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
      - run: ./scripts/dev_local.sh > /tmp/mindris-dev-local.log 2>&1 &
      - run: |
          for attempt in $(seq 1 30); do
            if ./scripts/smoke_local.sh; then
              exit 0
            fi
            sleep 2
          done
          echo "Local stack did not become ready in time" >&2
          exit 1
      - run: ./scripts/e2e_browser.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-logs
          path: |
            .logs
            /tmp/mindris-dev-local.log
