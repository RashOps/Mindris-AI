name: Promote Stable Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: rashops

concurrency:
  group: stable-release-promotion
  cancel-in-progress: false

jobs:
  verify-git-lineage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rc_tag: ${{ steps.verify.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main --tags --force
      - id: verify
        run: scripts/verify_release_promotion.sh "${GITHUB_REF_NAME}"

  promote-by-digest:
    runs-on: ubuntu-latest
    needs: verify-git-lineage
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - mindris-ai-api-gateway
          - mindris-ai-renderer
          - mindris-ai-web
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested manifest without rebuilding
        env:
          RC_TAG: ${{ needs.verify-git-lineage.outputs.rc_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${{ matrix.image }}"
          source_digest="$(docker buildx imagetools inspect "${image}:${RC_TAG}" --format '{{.Manifest.Digest}}')"
          test -n "$source_digest"
          docker buildx imagetools create \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:latest" \
            "${image}@${source_digest}"
          stable_digest="$(docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "${image}:latest" --format '{{.Manifest.Digest}}')"
          test "$source_digest" = "$stable_digest"
          test "$source_digest" = "$latest_digest"

  smoke-and-release:
    runs-on: ubuntu-latest
    needs:
      - verify-git-lineage
      - promote-by-digest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run playwright install chromium
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install stable stack
        run: |
          MINDRIS_HOME=/tmp/mindris-ai-stable-smoke \
          MINDRIS_RELEASE_REF="${GITHUB_REF_NAME}" \
          MINDRIS_VERSION="${GITHUB_REF_NAME}" \
          MINDRIS_WEB_PORT=3100 \
          scripts/install_self_hosted.sh
          api_key="$(sed -n 's/^API_KEY=//p' /tmp/mindris-ai-stable-smoke/.env)"
          test -n "$api_key"
          echo "::add-mask::$api_key"
          echo "MINDRIS_SMOKE_API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Smoke stable stack
        run: MINDRIS_HOME=/tmp/mindris-ai-stable-smoke WEB_URL=http://localhost:3100 scripts/smoke_release.sh
      - name: Browser E2E on promoted images
        env:
          WEB_URL: http://localhost:3100
          API_URL: http://localhost:8000
          API_KEY: ${{ env.MINDRIS_SMOKE_API_KEY }}
        run: scripts/e2e_browser.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Cleanup stable stack
        if: always()
        run: MINDRIS_HOME=/tmp/mindris-ai-stable-smoke REMOVE_DATA=true scripts/uninstall_self_hosted.sh || true
