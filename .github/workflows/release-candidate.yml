name: Release Candidate

on:
  push:
    tags:
      - "v*-rc.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: rashops

concurrency:
  group: release-candidate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/ -q
      - working-directory: apps/web
        run: bun install --frozen-lockfile
      - working-directory: apps/web
        run: bun test
      - working-directory: apps/web
        run: bun run lint
      - working-directory: apps/web
        run: bun run typecheck
      - working-directory: apps/web
        run: bun run build
      - working-directory: services/renderer
        run: bun install --frozen-lockfile
      - working-directory: services/renderer
        run: bun test
      - working-directory: services/renderer
        run: bun run typecheck
      - working-directory: services/renderer
        run: bun run build
      - run: docker compose -f docker-compose.release.yml config --quiet
      - run: sh -n scripts/install_self_hosted.sh scripts/update_self_hosted.sh scripts/uninstall_self_hosted.sh scripts/smoke_release.sh scripts/clean_self_hosted_test.sh scripts/verify_release_promotion.sh scripts/test_release_policy.sh
      - run: scripts/test_release_policy.sh

  build-and-publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mindris-ai-api-gateway
            context: .
            dockerfile: Dockerfile
          - image: mindris-ai-renderer
            context: services/renderer
            dockerfile: services/renderer/Dockerfile
          - image: mindris-ai-web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=http://localhost:8000
              NEXT_PUBLIC_RENDERER_URL=http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.ref_name }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run playwright install chromium
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install candidate stack
        run: |
          MINDRIS_HOME=/tmp/mindris-ai-release-smoke \
          MINDRIS_RELEASE_REF="${GITHUB_REF_NAME}" \
          MINDRIS_VERSION="${GITHUB_REF_NAME}" \
          MINDRIS_WEB_PORT=3100 \
          scripts/install_self_hosted.sh
          api_key="$(sed -n 's/^API_KEY=//p' /tmp/mindris-ai-release-smoke/.env)"
          test -n "$api_key"
          echo "::add-mask::$api_key"
          echo "MINDRIS_SMOKE_API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Smoke candidate stack
        run: MINDRIS_HOME=/tmp/mindris-ai-release-smoke WEB_URL=http://localhost:3100 scripts/smoke_release.sh
      - name: Browser E2E on candidate images
        env:
          WEB_URL: http://localhost:3100
          API_URL: http://localhost:8000
          API_KEY: ${{ env.MINDRIS_SMOKE_API_KEY }}
        run: scripts/e2e_browser.sh
      - name: Cleanup candidate stack
        if: always()
        run: MINDRIS_HOME=/tmp/mindris-ai-release-smoke REMOVE_DATA=true scripts/uninstall_self_hosted.sh || true
