[project]
name = "mindris-ai"
version = "0.1.0"
description = "Mindris AI Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.3.4",
]

[tool.uv.workspace]
members = [
    "services/api-gateway",
    "services/intelligence",
    "services/scraper",
    "packages/database",
    "packages/utils",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "D", "ANN", "T20", "SIM", "C4"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D107",   # __init__ docstring optional when class has one
    "ANN401", # allow Any return type occasionally
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"run_pipeline.py" = ["T201", "T203", "ANN"]
"test_*.py" = ["T201", "ANN", "D"]
"*/__main__.py" = ["T201", "ANN"]
# Long log format strings and print messages are acceptable
"packages/utils/config.py" = ["E501"]
"packages/utils/logger.py" = ["E501"]
"services/scraper/core.py" = ["T201", "E501"]
# Auto-generated stubs — not our concern
"services/api-gateway/__init__.py" = ["D", "N"]
"services/intelligence/__init__.py" = ["D"]
"services/scraper/__init__.py" = ["D"]
"packages/database/schemas/__init__.py" = ["D", "ANN"]
"packages/database/schemas/cv_schema.py" = ["D", "ANN"]
