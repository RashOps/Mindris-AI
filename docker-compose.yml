services:
  api-gateway:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      API_KEY: ${API_KEY:-dev-mindris-api-key}
      RENDERER_URL: http://renderer:4000
      STORAGE_DIR: /app/storage
      LOGS_DIR: /app/logs
      CHROMA_DB_DIR: /app/storage/vectordb
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  renderer:
    build:
      context: ./services/renderer
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:4000/'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_RENDERER_URL: ${NEXT_PUBLIC_RENDERER_URL:-http://localhost:4000}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-${API_KEY:-dev-mindris-api-key}}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_RENDERER_URL: ${NEXT_PUBLIC_RENDERER_URL:-http://localhost:4000}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-${API_KEY:-dev-mindris-api-key}}
    depends_on:
      api-gateway:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
