services:
  api-gateway:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RENDERER_URL=http://renderer:4000
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      - renderer

  renderer:
    build: ./services/renderer
    ports:
      - "4000:4000"

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_RENDERER_URL=http://localhost:4000
      - NEXT_PUBLIC_API_KEY=${API_KEY:-dev-mindris-api-key}
    depends_on:
      - api-gateway
